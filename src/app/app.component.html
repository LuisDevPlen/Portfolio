<div class="page folio-page fp-site">
  <header class="fp-header" [class.fp-header--scrolled]="scrolled">
    <div class="fp-container fp-header__inner">
      <div class="fp-header__brand">
        <button
          *ngIf="isMobileNav"
          pButton
          pRipple
          type="button"
          icon="pi pi-bars"
          class="p-button-rounded p-button-text fp-burger"
          aria-label="Abrir menu"
          (click)="mobileNavOpen = true"
        ></button>
        <a href="#inicio" class="fp-header__logo-text" (click)="scrollTo('inicio'); $event.preventDefault()">{{ profile.fullName }}</a>
      </div>

      <nav class="fp-header__nav" *ngIf="!isMobileNav" aria-label="Secções do portfólio">
        <div class="fp-header__nav-pill">
          <a
            *ngFor="let link of navLinks"
            class="fp-header__link"
            [href]="'#' + link.id"
            (click)="scrollTo(link.id); $event.preventDefault()"
            >{{ link.label }}</a
          >
        </div>
      </nav>

      <div class="fp-header__actions">
        <button
          pButton
          pRipple
          type="button"
          [icon]="darkMode ? 'pi pi-sun' : 'pi pi-moon'"
          class="p-button-rounded p-button-text fp-theme-btn"
          [attr.aria-label]="darkMode ? 'Ativar tema claro' : 'Ativar tema escuro'"
          (click)="toggleTheme()"
        ></button>
      </div>
    </div>
  </header>

  <p-sidebar
    [(visible)]="mobileNavOpen"
    [modal]="true"
    [dismissible]="true"
    position="left"
    styleClass="folio-sidebar"
  >
    <ng-template pTemplate="header">
      <span class="folio-sidebar__title">Menu</span>
    </ng-template>
    <div class="folio-sidebar__nav">
      <button
        *ngFor="let link of navLinks"
        pButton
        pRipple
        type="button"
        [icon]="link.icon"
        [label]="link.label"
        class="p-button-text folio-sidebar-link"
        (click)="scrollTo(link.id)"
      ></button>
    </div>
  </p-sidebar>

  <main>
    <app-hero-section [profile]="profile"></app-hero-section>
    <app-about-section
      [summary]="profile.summary"
      [fullName]="profile.fullName"
      [photoUrl]="profile.photoUrl"
      [aboutParagraphs]="profile.aboutParagraphs"
      [aboutFeatures]="profile.aboutFeatures"
      [highlights]="profile.highlights"
    ></app-about-section>
    <app-experience-section [experiences]="profile.experiences"></app-experience-section>
    <app-projects-section [projects]="profile.projects" [fallbackGithubUrl]="profile.githubUrl"></app-projects-section>
    <app-skills-section [categories]="profile.skillCategories" [skillsIntro]="profile.skillsIntro"></app-skills-section>
    <app-companies-section [companies]="profile.companies"></app-companies-section>
    <app-education-section [education]="profile.education"></app-education-section>
    <app-contact-section [profile]="profile"></app-contact-section>
  </main>

  <footer class="fp-footer">
    <div class="fp-container">
      <div class="fp-footer__grid">
        <div class="fp-footer__col">
          <h3 class="fp-footer__col-title">Links Rápidos</h3>
          <ul class="fp-footer__links">
            <li *ngFor="let link of navLinks">
              <a [href]="'#' + link.id" (click)="scrollTo(link.id); $event.preventDefault()">{{ link.label }}</a>
            </li>
          </ul>
        </div>
        <div class="fp-footer__col">
          <h3 class="fp-footer__col-title">Redes Sociais</h3>
          <div class="fp-footer__social">
            <a
              *ngIf="profile.githubUrl"
              [href]="profile.githubUrl"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
            >
              <i class="pi pi-github"></i>
            </a>
            <a
              *ngIf="profile.linkedinUrl"
              [href]="profile.linkedinUrl"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <i class="pi pi-linkedin"></i>
            </a>
            <a [href]="'mailto:' + profile.email" aria-label="Email"><i class="pi pi-envelope"></i></a>
          </div>
        </div>
      </div>
      <hr class="fp-footer__rule" />
      <p class="fp-footer__credit">© {{ year }} {{ profile.fullName }}. Todos os direitos reservados.</p>
    </div>
  </footer>

  <p-scrollTop styleClass="fp-scrolltop folio-scrolltop" icon="pi pi-arrow-up" [threshold]="320"></p-scrollTop>
</div>
